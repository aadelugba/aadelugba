    <text class="sans" x="1090" y="146" text-anchor="middle" font-size="19" font-weight="600" fill="#e8f6fa">Observe</text>
    <text class="mono" x="1090" y="170" text-anchor="middle" font-size="13.5" fill="#9fb7c0">monitoring · drift</text>
  <circle r="6" fill="#70f0b1">
    <animateMotion path="M110 100H1090" keyPoints="0;1;1" keyTimes="0;0.857;1" calcMode="linear" dur="7s" repeatCount="indefinite"/>
  </circle>
</svg>
