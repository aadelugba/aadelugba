    <circle cx="1090" cy="100" r="13" fill="#061017" stroke="#35d3ff" stroke-opacity=".5" stroke-width="2">
      <animate attributeName="stroke-opacity" values=".5;1;.5;.5" keyTimes="0;0.057;0.229;1" dur="7s" begin="6.00s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1090" cy="100" r="5" fill="#35d3ff">
      <animate attributeName="r" values="5;9;5;5" keyTimes="0;0.057;0.229;1" dur="7s" begin="6.00s" repeatCount="indefinite"/>
      <animate attributeName="fill" values="#35d3ff;#70f0b1;#35d3ff;#35d3ff" keyTimes="0;0.057;0.229;1" dur="7s" begin="6.00s" repeatCount="indefinite"/>
