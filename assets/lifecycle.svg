    <text class="mono" x="306" y="170" text-anchor="middle" font-size="13.5" fill="#9fb7c0">ADR · HLD · LLD</text>
    <circle cx="502" cy="100" r="13" fill="#061017" stroke="#35d3ff" stroke-opacity=".5" stroke-width="2">
      <animate attributeName="stroke-opacity" values=".5;1;.5;.5" keyTimes="0;0.057;0.229;1" dur="7s" begin="2.40s" repeatCount="indefinite"/>
    </circle>
    <circle cx="502" cy="100" r="5" fill="#35d3ff">
      <animate attributeName="r" values="5;9;5;5" keyTimes="0;0.057;0.229;1" dur="7s" begin="2.40s" repeatCount="indefinite"/>
      <animate attributeName="fill" values="#35d3ff;#70f0b1;#35d3ff;#35d3ff" keyTimes="0;0.057;0.229;1" dur="7s" begin="2.40s" repeatCount="indefinite"/>
    </circle>
    <text class="sans" x="502" y="146" text-anchor="middle" font-size="19" font-weight="600" fill="#e8f6fa">Build</text>
    <text class="mono" x="502" y="170" text-anchor="middle" font-size="13.5" fill="#9fb7c0">RAG · agents · APIs</text>
    <circle cx="698" cy="100" r="13" fill="#061017" stroke="#35d3ff" stroke-opacity=".5" stroke-width="2">
      <animate attributeName="stroke-opacity" values=".5;1;.5;.5" keyTimes="0;0.057;0.229;1" dur="7s" begin="3.60s" repeatCount="indefinite"/>
    </circle>
    <circle cx="698" cy="100" r="5" fill="#35d3ff">
      <animate attributeName="r" values="5;9;5;5" keyTimes="0;0.057;0.229;1" dur="7s" begin="3.60s" repeatCount="indefinite"/>
      <animate attributeName="fill" values="#35d3ff;#70f0b1;#35d3ff;#35d3ff" keyTimes="0;0.057;0.229;1" dur="7s" begin="3.60s" repeatCount="indefinite"/>
    </circle>
    <text class="sans" x="698" y="146" text-anchor="middle" font-size="19" font-weight="600" fill="#e8f6fa">Evaluate</text>
    <text class="mono" x="698" y="170" text-anchor="middle" font-size="13.5" fill="#9fb7c0">accuracy gates</text>
    <circle cx="894" cy="100" r="13" fill="#061017" stroke="#35d3ff" stroke-opacity=".5" stroke-width="2">
      <animate attributeName="stroke-opacity" values=".5;1;.5;.5" keyTimes="0;0.057;0.229;1" dur="7s" begin="4.80s" repeatCount="indefinite"/>
