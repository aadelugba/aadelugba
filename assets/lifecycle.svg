      <animate attributeName="r" values="5;9;5;5" keyTimes="0;0.057;0.229;1" dur="7s" begin="1.20s" repeatCount="indefinite"/>
      <animate attributeName="fill" values="#35d3ff;#70f0b1;#35d3ff;#35d3ff" keyTimes="0;0.057;0.229;1" dur="7s" begin="1.20s" repeatCount="indefinite"/>
    </circle>
